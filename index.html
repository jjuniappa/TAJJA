<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08090b" />
  <title>Number Duel Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <section class="scene" aria-label="Number Duel 온라인 게임 보드">
      <img class="scene-image" src="assets/game-scene.png" alt="고딕 카드 경기장과 여성 상대, 카드 테이블" />

      <header class="hud hud-ai">
        <span id="opponentName" class="name">OPPONENT</span>
        <div class="energy-track"><div id="opponentEnergyBar" class="energy-fill"></div></div>
        <strong id="opponentEnergyText">20</strong>
      </header>

      <aside class="room-badge">
        방 코드 <strong id="roomCodeLabel">------</strong>
        <button id="copyRoomButton" type="button">복사</button>
      </aside>

      <div class="battle-zone">
        <div class="played-card ai-played" id="opponentPlayedCard">
          <img src="assets/cards/back.png" alt="상대 카드 뒷면" />
        </div>

        <div id="roundMessage" class="round-message">방을 만들거나 입장하세요</div>

        <div class="played-card player-played" id="playerPlayedCard">
          <img src="assets/cards/back.png" alt="내 카드 뒷면" />
        </div>
      </div>

      <header class="hud hud-player">
        <span id="playerNameLabel" class="name">PLAYER</span>
        <div class="energy-track"><div id="playerEnergyBar" class="energy-fill"></div></div>
        <strong id="playerEnergyText">20</strong>
      </header>
    </section>

    <section class="hand-panel">
      <div class="hand-title">YOUR CARDS</div>
      <div id="playerHand" class="card-hand" aria-label="선택 가능한 카드"></div>
      <div class="action-row">
        <button id="leaveButton" class="secondary-button" type="button">방 나가기</button>
        <button id="restartButton" class="restart-button" type="button">재대결 요청</button>
      </div>
    </section>
  </main>

  <dialog id="lobbyDialog" class="lobby-dialog">
    <form method="dialog" class="lobby-card" onsubmit="return false;">
      <h1>NUMBER DUEL</h1>
      <p>친구와 같은 방 코드로 접속해 1:1 대결을 시작하세요.</p>

      <label>
        닉네임
        <input id="nicknameInput" maxlength="12" autocomplete="nickname" placeholder="PLAYER" />
      </label>

      <div class="lobby-actions">
        <button id="createRoomButton" class="primary-button" type="button">새 방 만들기</button>
      </div>

      <div class="divider"><span>또는</span></div>

      <label>
        방 코드
        <input id="roomCodeInput" maxlength="6" inputmode="text" autocomplete="off" placeholder="ABC123" />
      </label>

      <button id="joinRoomButton" class="secondary-button wide" type="button">방 입장</button>
      <p id="lobbyStatus" class="lobby-status" role="status"></p>

      <details>
        <summary>Firebase 설정이 필요한가요?</summary>
        <p><code>firebase-config.js</code>에 프로젝트 설정을 넣고 README 안내대로 익명 로그인과 Realtime Database를 활성화하세요.</p>
      </details>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="multiplayer.js"></script>
</body>
</html>
