<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Number Duel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <section class="scene" aria-label="Number Duel game board">
      <img id="sceneImage" class="scene-image" src="assets/game-scene.png" alt="고딕 카드 경기장과 여성 AI 상대, 카드 테이블" />

      <header class="hud hud-ai">
        <span class="name">AI Dealer</span>
        <div class="energy-track"><div id="aiEnergyBar" class="energy-fill"></div></div>
        <strong id="aiEnergyText">20</strong>
      </header>

      <div class="battle-zone">
        <div class="played-card ai-played" id="aiPlayedCard" aria-label="AI가 선택한 카드">
  <img src="assets/cards/back.png" alt="AI 카드 뒷면" />
</div>

        <div id="roundMessage" class="round-message">카드를 선택하세요</div>

        <div class="played-card player-played" id="playerPlayedCard" aria-label="플레이어가 선택한 카드">
  <img src="assets/cards/back.png" alt="플레이어 카드 뒷면" />
</div>
      </div>

      <header class="hud hud-player">
        <span class="name">PLAYER</span>
        <div class="energy-track"><div id="playerEnergyBar" class="energy-fill"></div></div>
        <strong id="playerEnergyText">20</strong>
      </header>
    </section>

    <section class="hand-panel">
      <div class="hand-title">YOUR CARDS</div>
      <div id="playerHand" class="card-hand" aria-label="선택 가능한 카드"></div>
      <button id="restartButton" class="restart-button" type="button">다시 시작</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
